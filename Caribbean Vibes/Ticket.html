 </header>

    <main>
        <div class="row justify-content-center">
            <div>

        <section>
        <h1 style="text-align: center;">Concert Tickets</h1>
        <p style="text-align: center;"> Please fill out the form below to request a ticket. <strong>Admission Free.</strong> 
                        </p>

        <form id="ticket_form">

                <label for="name">Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" minlength="6" required><br>

                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="guest@gmail.com" required><br>

                <label for="event" class="form-label">Event</label>
                <select id="event" class="form-select" required> >
                    <option value="">-- Choose an event --</option>
                    <option>Dancehall Yard Vibes</option>
                    <option>Soca Moca</option>
                    <option>Soca Carnival</option>
                    <option>Reggae Roots & Rhythms</option>
                </select><br>

            <button type="submit" class="w-100">Get Ticket</button>
        </form>


    <!-- Success pop-up -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header">
                    <h2 color="green" class="modal-title fs-5">Request received!</h2>
            </div>
            <div class="modal-body"> Further instructions will be sent to the email provided <strong id="successEmail"></strong>.
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
            </div>
            </div>
        </div>
    </div>
</section>
