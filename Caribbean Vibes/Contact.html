 </header>

    <main >
        <section>
            <h1 style="text-align: center;">Contact Us</h1>
            <p style="text-align: center;">
                If you have any questions or inquiries, please fill out
                the form below and we will get back to you as soon as possible.
            </p>

            <form id="Contact_form">

                <label for="name">Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" minlength="6" required><br>

                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="guest@gmail.com" required><br>

                <label for="phone" >Phone:</label><br>
                <input type="tel" id="phone" class="form-control" name="phone" required placeholder="876 123-4567" pattern="876[ \-][0-9]{3}-[0-9]{4}" title="Enter a Jamaican number, e.g. 876 123-4567 or 876-123-4567" ><br><br>

                <label for="message" class="form-label">Message:</label>
                <textarea id="message" name="message" class="form-control" rows="5" required></textarea><br>

                <button id="submitButton" type="submit" class="w-100">
                    Submit
                </button>

            </form>

            <p id="confirmation" class="text-center mt-4" role="status"></p>
        </section>
    </main>
